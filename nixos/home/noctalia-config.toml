# ~/.config/noctalia/config.toml

[theme]
mode = "dark"
source = "builtin"
builtin = "Tokyo-Night"

[shell]
font_family = "JetBrainsMono Nerd Font Propo"

[shell.panel]
# Frosted-glass shell: semi-transparent bar/launcher/cards over the wallpaper.
transparency_mode = "glass"

# ── Bar: vertical on the left side ──
# position | top | bottom | left | right
# When left/right, thickness = bar width in px.
[bar.main]
position           = "left"
thickness          = 40           # bar width (was 60)
background_opacity = 0.85         # glass bar: semi-transparent so wallpaper shows through
radius             = 6
margin_ends        = 0            # full-height bar — no inset from top/bottom
margin_edge        = 0            # flush to screen edge — no gap for windows to sneak into
padding            = 14
widget_spacing     = 6
scale              = 1.0
font_scale         = 1.0
shadow             = true
auto_hide          = false
reserve_space      = true
capsule            = false

# left-bar widget flow: top-to-bottom sections
start  = ["launcher", "wallpaper", "workspaces"]
center = ["clock", "von/pomodoro:widget"]
end    = ["media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

[wallpaper]
directory = "~/.config/wallpapers"

[backdrop]
enabled = true
blur_intensity = 0.7
tint_intensity = 0.2

# ── Plugins ──────────────────────────────────────────────────────────────
# Local pomodoro (~/.config/noctalia/plugins/pomodoro; deployed by Home Manager).
# Mod+p opens the panel. Inside it:
#   j / k   rest / work
#   i       edit that clock's length (25, 25m, 90s, 2h, 1:30)
#   Enter   commit the length and leave the field
#   space   start / pause
#   r       rewind the showing clock
#   Escape  close panel (Mod+p toggles); empty Enter cancels edit
# The bar widget under the clock shows W or R and the time left.
# Lengths edited with i are saved under Noctalia's plugin data dir and
# win over the minute defaults below on the next start.
[plugins]
enabled = ["von/pomodoro"]

[[plugins.source]]
name = "local"
kind = "path"
location = "@NOCTALIA_PLUGIN_SOURCE@"
enabled = true

[plugin_settings."von/pomodoro"]
work_minutes = 120
rest_minutes = 10
panel_placement = "attached"
panel_position = "auto"
panel_open_near_click = true

# ── Vim-style keybindings for Noctalia panels ─────────────────────────────
# Remaps vim motion keys to Noctalia's UI navigation actions.
# These apply to Noctalia's own panels (launcher, session, clipboard,
# wallpaper, settings, control center):
#   h/j/k/l → navigate left/down/up/right between buttons
#   Enter   → activate selected button
#   Escape  → close the panel
#   Tab     → move to next input field
# The pomodoro panel captures j, k, i, r, and space itself.
[keybinds]
left = ["h"]
right = ["l"]
up = ["k"]
down = ["j"]
validate = ["return", "kp_enter", "space"]
cancel = ["escape"]
tab_next = ["tab"]
tab_previous = ["shift+tab"]

# ── Lock screen ──────────────────────────────────────────────────────────
# The desktop wallpaper, softened, with a glass clock and a slim password bar.
# Positions are for the Virtual-1 output (3438×1288). The shell font and the
# active palette supply type and color, same as the bar.
[lockscreen]
enabled = true
blurred_desktop = false
transition = ["fade"]
transition_duration = 1100
edge_smoothness = 0.5
blur_intensity = 0.42
tint_intensity = 0.16

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "lockscreen-clock",
  "lockscreen-date",
  "lockscreen-login-box@Virtual-1",
]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = false

[lockscreen_widgets.widget.lockscreen-clock]
type = "clock"
output = "Virtual-1"
cx = 1719.0
cy = 390.0
box_width = 920.0
box_height = 260.0
rotation = 0.0
placement_width = 3438.0
placement_height = 1288.0

[lockscreen_widgets.widget.lockscreen-clock.settings]
clock_style = "digital"
format = "{:%H:%M}"
center_text = true
color = "primary"
font_family = "JetBrainsMono Nerd Font Propo"
shadow = false
background = true
background_color = "surface"
background_opacity = 0.5
background_radius = 18.0
background_padding = 28.0

[lockscreen_widgets.widget.lockscreen-date]
type = "clock"
output = "Virtual-1"
cx = 1719.0
cy = 590.0
box_width = 640.0
box_height = 88.0
rotation = 0.0
placement_width = 3438.0
placement_height = 1288.0

[lockscreen_widgets.widget.lockscreen-date.settings]
clock_style = "digital"
format = "{:%A, %B %d}"
center_text = true
color = "on_surface"
font_family = "JetBrainsMono Nerd Font Propo"
shadow = true
background = false

[lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
type = "login_box"
output = "Virtual-1"
cx = 1719.0
cy = 1088.0
box_width = 560.0
box_height = 72.0
rotation = 0.0
placement_width = 3438.0
placement_height = 1288.0

[lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
layout = "compact"
background_color = "surface"
background_opacity = 0.62
background_radius = 14.0
center_password_text = true
input_opacity = 0.72
input_radius = 10.0
show_caps_lock = true
show_keyboard_layout = false
show_login_button = true
show_media = false
show_session_buttons = false
show_unlock_hint = true
show_weather = false

