# Local pomodoro panel. Work and rest are two clocks.
# Mod+p opens the panel. j/k pick a clock, i edits its length, r resets it.

id = "von/pomodoro"
name = "Pomodoro"
version = "1.1.0"
plugin_api = 13
author = "von"
license = "MIT"
icon = "hourglass"
description = "Work and rest timers with vim keys."
tags = ["bar", "panel", "service", "productivity", "time", "countdown"]

[[setting]]
key = "work_minutes"
type = "int"
label_key = "settings.work_minutes.label"
description_key = "settings.work_minutes.description"
default = 120
min = 1
max = 1440

[[setting]]
key = "rest_minutes"
type = "int"
label_key = "settings.rest_minutes.label"
description_key = "settings.rest_minutes.description"
default = 10
min = 1
max = 1440

[[widget]]
id = "widget"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 280
height = 260
placement = "attached"
position = "auto"
open_near_click = true
keyboard_focus = "exclusive"
capture_keys = ["j", "k", "i", "r", "space"]

[[service]]
id = "timer"
entry = "service.luau"
